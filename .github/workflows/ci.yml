name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Unit, security and integration tests
        run: python -m pytest -q tests browser_relay/tests
      - name: Spec validator (personas, registry, versions, models, dungeons, links)
        run: python scripts/validate_specs.py
      - name: Claude Code plugin is in sync with .claude/ sources
        run: python scripts/build_plugin.py --check
      - name: Update-gate safety scenarios (bash)
        shell: bash
        run: |
          git config --global user.name ci && git config --global user.email ci@example.com
          bash tests/update_gate_scenarios.sh sh
      - name: Update-gate safety scenarios (PowerShell)
        if: runner.os == 'Windows'
        shell: bash
        run: bash tests/update_gate_scenarios.sh ps1

  dungeons:
    name: dungeons are valid (fail untouched, pass with solution)
    runs-on: windows-latest   # needs node, dart and Windows PowerShell 5.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dart-lang/setup-dart@v1
      - run: python -m pip install pytest
      - run: python -I tidos_evals/__main__.py validate -v

  scripts:
    name: script linters
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell scripts parse and are ASCII-only
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | Where-Object { $_.FullName -notmatch '\\evals\\' } | ForEach-Object {
            $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e) | Out-Null
            if ($e.Count) { Write-Host "PARSE ERROR $($_.FullName): $($e[0].Message)"; $bad++ }
            if (Select-String -Path $_.FullName -Pattern '[^\x00-\x7F]' -Quiet) { Write-Host "NON-ASCII $($_.FullName)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: PSScriptAnalyzer (errors only)
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
      - name: shellcheck (errors only)
        shell: bash
        run: |
          choco install shellcheck -y --no-progress > /dev/null
          shellcheck -S error scripts/*.sh tests/*.sh

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks on the working tree
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner
      - name: privacy firewall uses gitleaks too
        run: |
          export PATH="$PWD:$PATH"
          python3 scripts/sanitizer.py --check personas
